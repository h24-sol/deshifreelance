<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeshiFreelance - Microtask Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">

  <!-- Navigation Bar -->
  <nav class="bg-gray-800 border-b border-gray-700 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 bg-emerald-500 rounded-lg flex items-center justify-center font-bold text-gray-900 text-xl">DF</div>
          <span class="text-xl font-bold tracking-tight text-white">Deshi<span class="text-emerald-400">Freelance</span></span>
        </div>
        
        <div id="nav-user" class="hidden flex items-center space-x-3">
          <span id="user-display" class="text-sm font-medium text-gray-300"></span>
          <span id="user-balance" class="bg-emerald-500/10 text-emerald-400 text-xs font-bold px-3 py-1.5 rounded-full border border-emerald-500/20">৳ 0 BDT</span>
          <button onclick="openWithdrawModal()" class="text-xs bg-emerald-500 hover:bg-emerald-600 text-gray-900 font-bold px-3 py-1.5 rounded-lg transition">💸 Withdraw</button>
          <button onclick="logout()" class="text-xs bg-red-600/20 hover:bg-red-600/30 text-red-400 border border-red-500/30 px-3 py-1.5 rounded-md transition">Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">

    <!-- Auth View (Login / Register) -->
    <div id="auth-section" class="max-w-md mx-auto bg-gray-800 p-8 rounded-2xl border border-gray-700 shadow-xl">
      <div class="flex border-b border-gray-700 mb-6">
        <button id="tab-login" onclick="switchAuthTab('login')" class="flex-1 pb-3 font-semibold text-emerald-400 border-b-2 border-emerald-400 text-center">Login</button>
        <button id="tab-register" onclick="switchAuthTab('register')" class="flex-1 pb-3 font-semibold text-gray-400 border-b-2 border-transparent text-center">Register</button>
      </div>

      <div id="auth-alert" class="hidden mb-4 p-3 rounded-lg text-sm"></div>

      <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-4">
        <div id="name-field" class="hidden">
          <label class="block text-xs font-semibold text-gray-400 mb-1">Full Name</label>
          <input type="text" id="auth-name" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-emerald-500" placeholder="e.g. Tanvir Hasan">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">Email Address</label>
          <input type="email" id="auth-email" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-emerald-500" placeholder="name@domain.com">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">Password</label>
          <input type="password" id="auth-password" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-emerald-500" placeholder="••••••••">
        </div>

        <div id="role-field" class="hidden">
          <label class="block text-xs font-semibold text-gray-400 mb-1">Account Role</label>
          <select id="auth-role" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-emerald-500">
            <option value="worker">Microtask Worker</option>
            <option value="employer">Employer / Job Creator</option>
          </select>
        </div>

        <button type="submit" id="auth-btn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-gray-900 font-bold py-2.5 rounded-lg transition">Log In</button>
      </form>
    </div>

    <!-- Dashboard View -->
    <div id="dashboard-section" class="hidden space-y-8">

      <!-- Action Panel for Employers -->
      <div id="employer-controls" class="hidden bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-md">
        <h2 class="text-xl font-bold text-white mb-4">Post a New Microtask</h2>
        <form onsubmit="handleCreateTask(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-400 mb-1">Task Title</label>
            <input type="text" id="task-title" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white" placeholder="e.g. Subscribe to YouTube Channel">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-400 mb-1">Reward (BDT ৳)</label>
            <input type="number" id="task-reward" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white" placeholder="25">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-400 mb-1">Workers Needed</label>
            <input type="number" id="task-workers" value="5" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white">
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs font-semibold text-gray-400 mb-1">Task Instructions</label>
            <textarea id="task-desc" required rows="2" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white" placeholder="Provide step-by-step instructions and links..."></textarea>
          </div>
          <div class="md:col-span-2">
            <button type="submit" class="bg-emerald-500 hover:bg-emerald-600 text-gray-900 font-bold px-6 py-2.5 rounded-lg transition">Publish Task</button>
          </div>
        </form>
      </div>

      <!-- Task Feed -->
      <div>
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-2xl font-bold text-white">Available Microtasks</h2>
          <button onclick="loadTasks()" class="text-xs bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-300 px-3 py-1.5 rounded-lg transition">🔄 Refresh List</button>
        </div>

        <div id="task-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 w-full"></div>
      </div>
    </div>

  </main>

  <!-- Withdrawal Pop-up Modal -->
  <div id="withdraw-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-gray-800 border border-gray-700 w-full max-w-md rounded-2xl p-6 shadow-2xl relative">
      <div class="flex justify-between items-center mb-6">
        <h3 class="text-xl font-bold text-white">Withdraw Earnings</h3>
        <button onclick="closeWithdrawModal()" class="text-gray-400 hover:text-white font-bold text-lg">✕</button>
      </div>

      <form onsubmit="handleWithdrawSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">Payment Method</label>
          <select id="w-method" onchange="toggleBankFields()" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-emerald-500">
            <option value="bKash">bKash (Personal)</option>
            <option value="Nagad">Nagad (Personal)</option>
            <option value="Rocket">Rocket (Personal)</option>
            <option value="Bank">Bank Transfer (Bangladesh Local)</option>
          </select>
        </div>

        <div>
          <label id="w-acc-label" class="block text-xs font-semibold text-gray-400 mb-1">bKash Mobile Number</label>
          <input type="text" id="w-account" required placeholder="017XXXXXXXX" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-emerald-500">
        </div>

        <div id="bank-fields" class="hidden space-y-3">
          <div>
            <label class="block text-xs font-semibold text-gray-400 mb-1">Bank Name</label>
            <input type="text" id="w-bank-name" placeholder="e.g. Dutch-Bangla Bank, Islami Bank" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-400 mb-1">Branch Name & Routing No.</label>
            <input type="text" id="w-bank-branch" placeholder="e.g. Mirpur Branch (Routing: 090...)" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-400 mb-1">Account Holder Name</label>
            <input type="text" id="w-bank-holder" placeholder="Exact Account Name" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">Withdrawal Amount (BDT ৳)</label>
          <input type="number" id="w-amount" min="50" required placeholder="Min ৳50 BDT" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-emerald-500">
        </div>

        <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-gray-900 font-bold py-2.5 rounded-lg transition mt-4">Confirm Request</button>
      </form>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin + '/api';
    let authMode = 'login';
    let token = localStorage.getItem('df_token') || null;
    let user = JSON.parse(localStorage.getItem('df_user')) || null;

    document.addEventListener('DOMContentLoaded', () => {
      if (token && user) showDashboard();
    });

    function switchAuthTab(mode) {
      authMode = mode;
      const loginTab = document.getElementById('tab-login');
      const regTab = document.getElementById('tab-register');
      const nameField = document.getElementById('name-field');
      const roleField = document.getElementById('role-field');
      const authBtn = document.getElementById('auth-btn');

      if (mode === 'register') {
        regTab.className = "flex-1 pb-3 font-semibold text-emerald-400 border-b-2 border-emerald-400 text-center";
        loginTab.className = "flex-1 pb-3 font-semibold text-gray-400 border-b-2 border-transparent text-center";
        nameField.classList.remove('hidden');
        roleField.classList.remove('hidden');
        authBtn.innerText = 'Create Account';
      } else {
        loginTab.className = "flex-1 pb-3 font-semibold text-emerald-400 border-b-2 border-emerald-400 text-center";
        regTab.className = "flex-1 pb-3 font-semibold text-gray-400 border-b-2 border-transparent text-center";
        nameField.classList.add('hidden');
        roleField.classList.add('hidden');
        authBtn.innerText = 'Log In';
      }
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      const alertBox = document.getElementById('auth-alert');

      const endpoint = authMode === 'register' ? '/auth/register' : '/auth/login';
      const payload = authMode === 'register' ? {
        name: document.getElementById('auth-name').value,
        email,
        password,
        role: document.getElementById('auth-role').value
      } : { email, password };

      try {
        const res = await fetch(API_BASE + endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.message || 'Authentication failed');

        if (authMode === 'register') {
          alertBox.className = "mb-4 p-3 rounded-lg text-sm bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
          alertBox.innerText = "Registration successful! Please log in.";
          alertBox.classList.remove('hidden');
          switchAuthTab('login');
        } else {
          token = data.token;
          user = data.user;
          localStorage.setItem('df_token', token);
          localStorage.setItem('df_user', JSON.stringify(user));
          showDashboard();
        }
      } catch (err) {
        alertBox.className = "mb-4 p-3 rounded-lg text-sm bg-red-500/20 text-red-300 border border-red-500/30";
        alertBox.innerText = err.message;
        alertBox.classList.remove('hidden');
      }
    }

    function showDashboard() {
      document.getElementById('auth-section').classList.add('hidden');
      document.getElementById('dashboard-section').classList.remove('hidden');
      document.getElementById('nav-user').classList.remove('hidden');
      document.getElementById('user-display').innerText = `${user.name} (${user.role})`;
      document.getElementById('user-balance').innerText = `৳ ${user.balanceBDT || 0} BDT`;

      if (user.role === 'employer') {
        document.getElementById('employer-controls').classList.remove('hidden');
      }

      loadTasks();
    }

    function formatTaskDescription(text) {
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      return text.replace(urlRegex, (url) => {
        return `<div class="my-3"><a href="${url}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 text-xs font-semibold px-3 py-2 rounded-lg border border-emerald-500/30 transition break-all">Open Link 🔗</a></div>`;
      });
    }

    async function loadTasks() {
      const grid = document.getElementById('task-grid');
      grid.innerHTML = '<p class="text-gray-400 col-span-full text-center py-8">Loading available tasks...</p>';

      try {
        const res = await fetch(API_BASE + '/tasks');
        const tasks = await res.json();

        if (!tasks.length) {
          grid.innerHTML = '<p class="text-gray-500 col-span-full text-center py-8">No active tasks available right now.</p>';
          return;
        }

        grid.innerHTML = tasks.map(task => `
          <div class="bg-gray-800 rounded-xl border border-gray-700 p-6 flex flex-col justify-between hover:border-gray-600 transition shadow-lg w-full max-w-full overflow-hidden">
            <div class="w-full">
              <div class="flex items-start justify-between gap-3 mb-3">
                <h3 class="font-bold text-lg text-white break-words flex-1 min-w-0">${task.title}</h3>
                <span class="bg-emerald-500/10 text-emerald-400 font-bold text-sm px-3 py-1 rounded-full border border-emerald-500/20 shrink-0">৳${task.rewardBDT} BDT</span>
              </div>
              <div class="text-gray-400 text-sm mb-4 leading-relaxed break-words max-w-full overflow-hidden">${formatTaskDescription(task.description)}</div>
              <div class="text-xs text-gray-500 mb-4">
                <span>Employer: ${task.employer ? task.employer.name : 'Unknown'}</span>
              </div>
            </div>

            ${user && user.role === 'worker' ? `
              <div class="border-t border-gray-700 pt-4 mt-2 w-full">
                <input type="text" id="proof-${task._id}" placeholder="Enter proof (URL, Code, Username)..." class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-xs text-white mb-2 focus:outline-none focus:border-emerald-500">
                <button onclick="submitProof('${task._id}')" class="w-full bg-emerald-500 hover:bg-emerald-600 text-gray-900 text-xs font-bold py-2 rounded-lg transition">Submit Proof</button>
              </div>
            ` : ''}
          </div>
        `).join('');
      } catch (err) {
        grid.innerHTML = `<p class="text-red-400 col-span-full text-center py-8">Error loading tasks: ${err.message}</p>`;
      }
    }

    async function handleCreateTask(e) {
      e.preventDefault();
      const payload = {
        title: document.getElementById('task-title').value,
        rewardBDT: Number(document.getElementById('task-reward').value),
        workersNeeded: Number(document.getElementById('task-workers').value),
        description: document.getElementById('task-desc').value
      };

      try {
        const res = await fetch(API_BASE + '/tasks', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token,
            'x-auth-token': token
          },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error('Failed to create task');

        alert('Task posted successfully!');
        document.getElementById('task-title').value = '';
        document.getElementById('task-reward').value = '';
        document.getElementById('task-desc').value = '';
        loadTasks();
      } catch (err) {
        alert(err.message);
      }
    }

    async function submitProof(taskId) {
      const proofInput = document.getElementById(`proof-${taskId}`);
      const proofText = proofInput.value.trim();

      if (!proofText) {
        alert('Please enter proof details before submitting!');
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/tasks/${taskId}/submit`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token,
            'x-auth-token': token
          },
          body: JSON.stringify({ proofText })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Submission failed');

        alert('Proof submitted successfully!');
        proofInput.value = '';
      } catch (err) {
        alert(err.message);
      }
    }

    // --- WITHDRAWAL SYSTEM MODAL HANDLERS ---
    function openWithdrawModal() {
      document.getElementById('withdraw-modal').classList.remove('hidden');
    }

    function closeWithdrawModal() {
      document.getElementById('withdraw-modal').classList.add('hidden');
    }

    function toggleBankFields() {
      const method = document.getElementById('w-method').value;
      const label = document.getElementById('w-acc-label');
      const bankFields = document.getElementById('bank-fields');

      if (method === 'Bank') {
        label.innerText = 'Bank Account Number';
        bankFields.classList.remove('hidden');
      } else {
        label.innerText = `${method} Mobile Number`;
        bankFields.classList.add('hidden');
      }
    }

    async function handleWithdrawSubmit(e) {
      e.preventDefault();
      const method = document.getElementById('w-method').value;
      const accountNumber = document.getElementById('w-account').value;
      const amountBDT = Number(document.getElementById('w-amount').value);

      const bankDetails = method === 'Bank' ? {
        bankName: document.getElementById('w-bank-name').value,
        branch: document.getElementById('w-bank-branch').value,
        holderName: document.getElementById('w-bank-holder').value
      } : null;

      try {
        const res = await fetch(`${API_BASE}/withdraw`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token,
            'x-auth-token': token
          },
          body: JSON.stringify({ method, accountNumber, amountBDT, bankDetails })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Withdrawal failed');

        alert(data.message);
        user.balanceBDT = data.newBalance;
        localStorage.setItem('df_user', JSON.stringify(user));
        document.getElementById('user-balance').innerText = `৳ ${user.balanceBDT} BDT`;
        closeWithdrawModal();
      } catch (err) {
        alert(err.message);
      }
    }

    function logout() {
      localStorage.removeItem('df_token');
      localStorage.removeItem('df_user');
      window.location.reload();
    }
  </script>
</body>
</html>
